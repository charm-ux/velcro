# Product verification, called by CI (every PR and push to main) and by Pages (main). The build job builds the library
# and the docs once, scans that output and shares it with the later jobs as a workflow artifact; it also prints the build
# digest (every file of packages/velcro/dist and packages/docs/dist, bound to the commit). Each browser shard (one engine, one
# Playwright shard) and the upstream gate check that digest on the downloaded output before and after their checks, and
# nothing rebuilds it. The caller records publication evidence only in a job that needs this whole workflow to succeed.
# Raw output stays in each runner's ignored .airig/; only fixed status lines and verify:product's bounded, redacted summary
# are printed. The browser and upstream jobs run in the official Playwright container image pinned by digest, so no job
# installs system packages or downloads an engine at run time.
name: Product
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to verify
        type: string
        required: true
    outputs:
      digest:
        description: Build digest (every file of both dist trees, bound to the commit)
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.15.9
          run_install: false
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Public frozen dependency install
        run: |
          mkdir -p .airig/ci
          pnpm install --frozen-lockfile --prefer-offline --registry=https://registry.npmjs.org/ > .airig/ci/install.log 2>&1 || { echo 'install: blocked; private evidence retained'; exit 1; }
          echo 'install: passed'
      - name: Build the library and the docs once
        id: build
        run: |
          mkdir -p .airig/ci
          pnpm verify:product --stage build > .airig/ci/product-build.log 2>&1 || { awk '/^verify:product: / && n++ < 90 { print substr($0, 1, 300) }' .airig/ci/product-build.log; echo 'product build: blocked; private evidence retained'; exit 1; }
          digest=$(sed -n 's/^verify:product: build digest \([0-9a-f]\{64\}\)$/\1/p' .airig/ci/product-build.log)
          [ "${#digest}" = 64 ] || { echo 'product build: blocked (no build digest)'; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "product build: passed (build digest $digest)"
      # Caches only the pinned archive the installer keeps after verifying it; the installer re-verifies a restored archive
      # against the pinned SHA-256 before extracting anything (wrong bytes fail closed) and downloads only on a miss.
      - name: Cache the pinned Gitleaks archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .airig/tools/gitleaks/8.30.1/archives
          key: gitleaks-8.30.1-linux-x64-551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      - run: node scripts/security/gitleaks.mjs install
      # A signed-in user can download a public repository's workflow artifacts: every shared byte is scanned first. The scan
      # checks the build digest, then stages exactly the bytes it scanned (velcro/dist and docs/dist) for the upload; the
      # later jobs check the same digest on what they download into packages/.
      - name: Scan the build output and stage the scanned bytes for sharing
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/ci/scan-build-output.mjs --expect-digest "$DIGEST"
      - name: Share the scanned build output with the later jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-build
          path: .airig/ci/product-build
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  browser:
    name: browser (${{ matrix.engine }}, shard ${{ matrix.shard }} of 4)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The official Playwright image for the lockfile's Playwright version, pinned by digest: the engine builds and their system
    # libraries are in the image, so nothing is installed with apt or downloaded at run time. The tag names the version (the
    # bootstrap tests require it to be the lockfile's) and the digest fixes the bytes; the check step below confirms the
    # image records that version and holds the builds it expects. A non-root user (the hosted runner's uid, which owns the mounted
    # workspace and home; Firefox refuses to run as root there), an init process to reap engine child processes, and a
    # larger shared-memory size than Docker's 64 MB default instead of sharing the host's IPC namespace.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --user 1001 --shm-size=2g
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.15.9
          run_install: false
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Public frozen dependency install
        run: |
          mkdir -p .airig/ci
          pnpm install --frozen-lockfile --prefer-offline --registry=https://registry.npmjs.org/ > .airig/ci/install.log 2>&1 || { echo 'install: blocked; private evidence retained'; exit 1; }
          echo 'install: passed'
      - name: Check the image against the lockfile's Playwright
        env:
          ENGINE: ${{ matrix.engine }}
        run: node scripts/ci/playwright-image.mjs "$ENGINE"
      - name: Download the build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-build
          path: packages
      - name: Product verification (one engine, one shard)
        timeout-minutes: 35
        env:
          ENGINE: ${{ matrix.engine }}
          SHARD: ${{ matrix.shard }}/4
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          mkdir -p .airig/ci
          pnpm verify:product --stage browser --engine "$ENGINE" --shard "$SHARD" --expect-digest "$DIGEST" > .airig/ci/product.log 2>&1 || { awk '/^verify:product: / && n++ < 90 { print substr($0, 1, 300) }' .airig/ci/product.log; echo 'product: blocked; private evidence retained'; exit 1; }
          echo 'product: passed'

  upstream:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The same pinned image and options as the browser jobs (see there).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --user 1001 --shm-size=2g
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.15.9
          run_install: false
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Public frozen dependency install
        run: |
          mkdir -p .airig/ci
          pnpm install --frozen-lockfile --prefer-offline --registry=https://registry.npmjs.org/ > .airig/ci/install.log 2>&1 || { echo 'install: blocked; private evidence retained'; exit 1; }
          echo 'install: passed'
      # Shoelace's own tests run in Chromium.
      - name: Check the image against the lockfile's Playwright
        env:
          ENGINE: chromium
        run: node scripts/ci/playwright-image.mjs "$ENGINE"
      - name: Download the build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-build
          path: packages
      - name: Upstream conformance (Shoelace's own tests against the built library)
        timeout-minutes: 15
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          mkdir -p .airig/ci
          pnpm verify:product --stage upstream --expect-digest "$DIGEST" > .airig/ci/upstream.log 2>&1 || { awk '/^verify:product: / && n++ < 90 { print substr($0, 1, 300) }' .airig/ci/upstream.log; echo 'upstream: blocked; private evidence retained'; exit 1; }
          echo 'upstream: passed'
