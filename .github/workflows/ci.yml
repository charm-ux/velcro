name: CI
on:
  push:
    branches: [main]
  pull_request:
    # labeled: the approver's history-scan-approved label re-runs the checks for the exact head it was applied to.
    # edited: a base change (retarget) re-runs every job, so no earlier result stands for the new base. Title or
    # body edits re-run them too; every job still runs, so the required aggregate is unaffected.
    types: [opened, synchronize, reopened, labeled, edited]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.15.9
          run_install: false
      - name: Public frozen dependency install
        run: |
          mkdir -p .airig/ci
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/ > .airig/ci/install.log 2>&1 || { echo 'install: blocked; private evidence retained'; exit 1; }
          echo 'install: passed'
      - run: node scripts/security/gitleaks.mjs install
      - name: Verify with private raw output
        run: |
          pnpm verify:source > .airig/ci/verify.log 2>&1 || { echo 'verify: blocked; private evidence retained'; exit 1; }
          echo 'verify: passed'

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # On PRs only base-owned engines may certify candidate Git objects. An
      # initial base without these controls fails: bootstrap needs local review.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .airig/trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - run: node .airig/trusted/scripts/security/gitleaks.mjs install
      # Every PR first meets the publication budget against the fetched main, whatever its event base: more than
      # 1,000 changed files in main..head need approval, which is the history-scan-approved label applied by the
      # login in the VELCRO_HISTORY_APPROVER repository variable (unset: nobody can approve) and approves only the
      # head of that labeled run. Later pushes, retargets and runs started by any other label or edit are not
      # approved until the label is re-applied. Content is then scanned file by changed file for commits new to the
      # event base (on main: since the previous main tip); metadata of the full ancestry always is. Without a base
      # that is the fetched main or its ancestor (first push, PR into another branch, force push) the full history
      # is scanned under the hard caps, while the budget above still applies to PRs.
      - name: Trusted source and history scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_OID: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_OID: ${{ github.event.pull_request.head.sha || github.sha }}
          VELCRO_HISTORY_APPROVED: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'history-scan-approved' && vars.VELCRO_HISTORY_APPROVER != '' && github.event.sender.login == vars.VELCRO_HISTORY_APPROVER && github.event.pull_request.head.sha || '' }}
        run: |
          guard=.airig/trusted/scripts/security/git-privacy.mjs
          if [ "$EVENT_NAME" = pull_request ]; then
            main_oid=$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')
            node "$guard" history "$main_oid..$HEAD_OID"
          fi
          if [ -n "$(printf '%s' "$BASE_OID" | tr -d 0)" ] && git merge-base --is-ancestor "$BASE_OID" refs/remotes/origin/main; then
            scope="$BASE_OID..$HEAD_OID"
          else
            scope="$HEAD_OID"
          fi
          node "$guard" history "$scope"
      # Detection is not approval: protected changes require a separate human
      # merge/publication gate, not a false secret finding or a blocked PR push.
      - name: Report protected changes requiring independent human review
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_OID: ${{ github.event.pull_request.base.sha }}
          HEAD_OID: ${{ github.event.pull_request.head.sha }}
        run: node .airig/trusted/scripts/security/git-privacy.mjs policy "$BASE_OID" "$HEAD_OID"

  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.15.9
          run_install: false
      - name: Public frozen dependency install
        run: |
          mkdir -p .airig/ci
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/ > .airig/ci/product-install.log 2>&1 || { echo 'install: blocked; private evidence retained'; exit 1; }
          echo 'install: passed'
      - name: Install system dependencies for Chromium, Firefox and WebKit (disposable runner)
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          mkdir -p .airig/ci
          echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
          # A stalled mirror connection must time out and retry instead of hanging the download.
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee "$(apt-config shell d Dir::Etc::parts/d | sed "s/^d='//; s/'$//")80-velcro-ci" > .airig/ci/apt-config.log
          ok=0
          for attempt in 1 2; do
            code=0
            timeout -k 10 330 pnpm exec playwright install-deps chromium firefox webkit > .airig/ci/browser-deps-$attempt.log 2>&1 || code=$?
            if [ "$code" = 0 ]; then ok=1; break; fi
            if [ "$code" = 124 ] || [ "$code" = 137 ]; then echo "browser system dependencies: attempt $attempt timed out"; else echo "browser system dependencies: attempt $attempt failed (exit code $code)"; fi
          done
          [ "$ok" = 1 ] || { echo 'browser system dependencies: blocked; private evidence retained'; exit 1; }
          echo 'browser system dependencies: passed'
      - name: Install Chromium, Firefox and WebKit (disposable runner)
        timeout-minutes: 12
        run: |
          mkdir -p .airig/ci
          code=0
          timeout -k 10 480 pnpm exec playwright install chromium firefox webkit > .airig/ci/browser.log 2>&1 || code=$?
          if [ "$code" != 0 ]; then
            if [ "$code" = 124 ] || [ "$code" = 137 ]; then echo 'browser setup: timed out'; else echo "browser setup: failed (exit code $code)"; fi
            echo 'browser setup: blocked; private evidence retained'
            exit 1
          fi
          echo 'browser setup: passed'
      - name: Product verification (Chromium, Firefox and WebKit)
        timeout-minutes: 35
        run: |
          mkdir -p .airig/ci
          pnpm verify:product > .airig/ci/product.log 2>&1 || { awk '/^verify:product: / && n++ < 90 { print substr($0, 1, 300) }' .airig/ci/product.log; echo 'product: blocked; private evidence retained'; exit 1; }
          echo 'product: passed'
      # Verifies site preparation (notices, allowlist, scans) on every PR. Nothing is uploaded or deployed here.
      - run: node scripts/security/gitleaks.mjs install
      - name: Site preparation check (no upload)
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/site/prepare.mjs --base /velcro --out .airig/site/run --expect-sha "$SOURCE_SHA"

  required:
    if: ${{ always() }}
    needs: [verify, product, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      # Inline fixed check, not an aggregate script supplied by the candidate.
      - name: Require every expected job to succeed
        env:
          VELCRO_CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            let good = false;
            try {
              const n = JSON.parse(process.env.VELCRO_CI_NEEDS);
              good = n && Object.keys(n).sort().join(",") === "product,security,verify"
                && ["security", "verify", "product"].every(k => n[k]?.result === "success");
            } catch {}
            console.log(good ? "required: passed" : "required: blocked");
            process.exitCode = good ? 0 : 1;
          '
