name: CI
on:
  push:
    branches: [main]
  pull_request:
    # labeled: the owner's history-scan-approved label re-runs the checks for the exact head it was applied to.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.15.9
          run_install: false
      - name: Public frozen dependency install
        run: |
          mkdir -p .airig/ci
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/ > .airig/ci/install.log 2>&1 || { echo 'install: blocked; private evidence retained'; exit 1; }
          echo 'install: passed'
      - run: node scripts/security/gitleaks.mjs install
      - name: Verify with private raw output
        run: |
          pnpm verify:source > .airig/ci/verify.log 2>&1 || { echo 'verify: blocked; private evidence retained'; exit 1; }
          echo 'verify: passed'

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # On PRs only base-owned engines may certify candidate Git objects. An
      # initial base without these controls fails: bootstrap needs local review.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .airig/trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - run: node .airig/trusted/scripts/security/gitleaks.mjs install
      # Content of commits new to the PR base (on main: since the previous main tip) is scanned file by changed
      # file; metadata of the full ancestry always is. A range over 1,000 changed files needs owner approval: the
      # history-scan-approved label applied by the approver named in the VELCRO_HISTORY_APPROVER repository variable
      # (unset: nobody can approve), which approves only the head it was applied to (this labeled run). Later pushes,
      # and runs started by any other label, are not approved until the label is re-applied. Without a base that is
      # the fetched main or its ancestor (first push, new branch, PR into another branch, force push) the full
      # history is scanned under the hard caps.
      - name: Trusted source and history scan
        env:
          BASE_OID: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_OID: ${{ github.event.pull_request.head.sha || github.sha }}
          VELCRO_HISTORY_APPROVED: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'history-scan-approved' && vars.VELCRO_HISTORY_APPROVER != '' && github.event.sender.login == vars.VELCRO_HISTORY_APPROVER && github.event.pull_request.head.sha || '' }}
        run: |
          if [ -n "$(printf '%s' "$BASE_OID" | tr -d 0)" ] && git merge-base --is-ancestor "$BASE_OID" refs/remotes/origin/main; then
            scope="$BASE_OID..$HEAD_OID"
          else
            scope="$HEAD_OID"
          fi
          node .airig/trusted/scripts/security/git-privacy.mjs history "$scope"
      # Detection is not approval: protected changes require a separate human
      # merge/publication gate, not a false secret finding or a blocked PR push.
      - name: Report protected changes requiring independent human review
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_OID: ${{ github.event.pull_request.base.sha }}
          HEAD_OID: ${{ github.event.pull_request.head.sha }}
        run: node .airig/trusted/scripts/security/git-privacy.mjs policy "$BASE_OID" "$HEAD_OID"

  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.15.9
          run_install: false
      - name: Public frozen dependency install
        run: |
          mkdir -p .airig/ci
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/ > .airig/ci/product-install.log 2>&1 || { echo 'install: blocked; private evidence retained'; exit 1; }
          echo 'install: passed'
      - name: Install Chromium and system dependencies (disposable runner)
        run: |
          pnpm exec playwright install --with-deps chromium > .airig/ci/browser.log 2>&1 || { echo 'browser setup: blocked; private evidence retained'; exit 1; }
          echo 'browser setup: passed'
      - name: Product verification (Chromium only)
        run: |
          mkdir -p .airig/ci
          pnpm verify:product > .airig/ci/product.log 2>&1 || { echo 'product: blocked; private evidence retained'; exit 1; }
          echo 'product: passed'
      # Verifies site preparation (notices, allowlist, scans) on every PR. Nothing is uploaded or deployed here.
      - run: node scripts/security/gitleaks.mjs install
      - name: Site preparation check (no upload)
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/site/prepare.mjs --base /velcro --out .airig/site/run --expect-sha "$SOURCE_SHA"

  required:
    if: ${{ always() }}
    needs: [verify, product, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      # Inline fixed check, not an aggregate script supplied by the candidate.
      - name: Require every expected job to succeed
        env:
          VELCRO_CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            let good = false;
            try {
              const n = JSON.parse(process.env.VELCRO_CI_NEEDS);
              good = n && Object.keys(n).sort().join(",") === "product,security,verify"
                && ["security", "verify", "product"].every(k => n[k]?.result === "success");
            } catch {}
            console.log(good ? "required: passed" : "required: blocked");
            process.exitCode = good ? 0 : 1;
          '
