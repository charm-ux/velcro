name: CI
# A pull request run's name binds it to its PR, base branch and mode: `full` runs the analysis jobs, `repeat` (a title
# or body edit) only repeats the latest full run's result for the same head, PR and base (see the required job).
run-name: ${{ github.event_name == 'pull_request' && format('CI pr {0} into {1} ({2})', github.event.pull_request.number, github.event.pull_request.base.ref, github.event.action == 'edited' && !github.event.changes.base && 'repeat' || 'full') || format('CI {0} {1}', github.event_name, github.sha) }}
on:
  push:
    branches: [main]
  pull_request:
    # labeled: the approver's history-scan-approved label re-runs the checks for the exact head it was applied to.
    # edited: a base change (retarget) re-runs every job, so no earlier result stands for the new base. A title or body
    # edit changes neither the head nor the base: the analysis jobs are skipped and `required` repeats the result of
    # the newest full run of this workflow for the same PR, base branch and head (pending or none: blocked), so an
    # edit neither clears nor approves anything.
    types: [opened, synchronize, reopened, labeled, edited]
  # The merge queue tests the exact commit that lands on main: main (the group's base) plus the squashed pull request.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.15.9
          run_install: false
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Public frozen dependency install
        run: |
          mkdir -p .airig/ci
          pnpm install --frozen-lockfile --prefer-offline --registry=https://registry.npmjs.org/ > .airig/ci/install.log 2>&1 || { echo 'install: blocked; private evidence retained'; exit 1; }
          echo 'install: passed'
      - run: node scripts/security/gitleaks.mjs install
      - name: Verify with private raw output
        run: |
          pnpm verify:source > .airig/ci/verify.log 2>&1 || { echo 'verify: blocked; private evidence retained'; exit 1; }
          echo 'verify: passed'

  security:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # On PRs and merge groups only base-owned engines may certify candidate Git
      # objects. An initial base without these controls fails: bootstrap needs local review.
      # A merge group's base is main only while the queue builds one entry at a time
      # (max_entries_to_build: 1, docs/contributing.md); behind another group it is that group.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: .airig/trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - run: node .airig/trusted/scripts/security/gitleaks.mjs install
      # Every PR and merge group first meets the publication budget against the fetched main, whatever its event
      # base: more than 1,000 changed files in main..head need approval, which is the history-scan-approved label
      # applied by the login in the VELCRO_HISTORY_APPROVER repository variable (unset: nobody can approve) and
      # approves only the head of that labeled run. Later pushes, retargets and runs started by any other label or
      # edit are not approved until the label is re-applied. A merge group has no approval channel: its squashed
      # commit is a new head with its own cap, so one whose squash exceeds the budget cannot pass the queue
      # (docs/contributing.md).
      # Content is then scanned file by changed file for commits new to the event base (on main: since the previous
      # main tip; in a merge group: since its base), unless that is the budget range just scanned; metadata of the
      # full ancestry always is. Without a base that is the fetched main or its ancestor (first push, PR into another
      # branch, force push, a group queued behind another group) the full history is scanned under the hard caps,
      # while the budget above still applies to PRs and merge groups.
      - name: Trusted source and history scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_OID: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_OID: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          VELCRO_HISTORY_APPROVED: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'history-scan-approved' && vars.VELCRO_HISTORY_APPROVER != '' && github.event.sender.login == vars.VELCRO_HISTORY_APPROVER && github.event.pull_request.head.sha || '' }}
        run: |
          guard=.airig/trusted/scripts/security/git-privacy.mjs
          budget=
          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = merge_group ]; then
            main_oid=$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')
            budget="$main_oid..$HEAD_OID"
            node "$guard" history "$budget"
          fi
          if [ -n "$(printf '%s' "$BASE_OID" | tr -d 0)" ] && git merge-base --is-ancestor "$BASE_OID" refs/remotes/origin/main; then
            scope="$BASE_OID..$HEAD_OID"
          else
            scope="$HEAD_OID"
          fi
          if [ "$scope" != "$budget" ]; then node "$guard" history "$scope"; fi
      # Detection is not approval: protected changes require a separate human
      # merge/publication gate, not a false secret finding or a blocked PR push.
      - name: Report protected changes requiring independent human review
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          BASE_OID: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_OID: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: node .airig/trusted/scripts/security/git-privacy.mjs policy "$BASE_OID" "$HEAD_OID"

  # Builds once, then every engine in four shards and the upstream gate, each on that same output (product.yml).
  product:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base }}
    uses: ./.github/workflows/product.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  # Runs only when every product job succeeded: records the tested-bytes evidence for the build output they all checked,
  # then verifies site preparation (notices, allowlist, scans) on every PR. Nothing is uploaded or deployed here.
  site:
    needs: product
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.15.9
          run_install: false
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Public frozen dependency install
        run: |
          mkdir -p .airig/ci
          pnpm install --frozen-lockfile --prefer-offline --registry=https://registry.npmjs.org/ > .airig/ci/install.log 2>&1 || { echo 'install: blocked; private evidence retained'; exit 1; }
          echo 'install: passed'
      - name: Download the build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-build
          path: packages
      - name: Record the tested-bytes evidence
        env:
          DIGEST: ${{ needs.product.outputs.digest }}
        run: |
          mkdir -p .airig/ci
          pnpm verify:product --stage evidence --expect-digest "$DIGEST" > .airig/ci/evidence.log 2>&1 || { awk '/^verify:product: / && n++ < 20 { print substr($0, 1, 300) }' .airig/ci/evidence.log; echo 'evidence: blocked; private evidence retained'; exit 1; }
          echo 'evidence: passed'
      - run: node scripts/security/gitleaks.mjs install
      - name: Site preparation check (no upload)
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/site/prepare.mjs --base /velcro --out .airig/site/run --expect-sha "$SOURCE_SHA"

  # Always runs. Ordinarily every expected job must have succeeded. On a title or body edit (the analysis jobs are
  # skipped) it instead repeats the newest full run of this workflow for the same head, PR and base branch, chosen by
  # run number (creation order), never by completion time: it passes only when that run completed successfully, so a
  # pending or failed newer run blocks and repeat runs are never evidence. Listing runs needs `actions: read`.
  required:
    if: ${{ always() }}
    needs: [verify, product, site, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      # Inline fixed check, not an aggregate script supplied by the candidate.
      - name: Require every expected job to succeed
        env:
          VELCRO_CI_NEEDS: ${{ toJSON(needs) }}
          VELCRO_CI_CARRY: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && 'true' || '' }}
          VELCRO_CI_HEAD: ${{ github.event.pull_request.head.sha }}
          VELCRO_CI_PR: ${{ github.event.pull_request.number }}
          VELCRO_CI_BASE: ${{ github.event.pull_request.base.ref }}
          VELCRO_CI_RUN: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VELCRO_CI_PRIOR=
          if [ "$VELCRO_CI_CARRY" = true ]; then
            VELCRO_CI_PRIOR="$RUNNER_TEMP/required-prior.json"
            gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$VELCRO_CI_HEAD&event=pull_request&per_page=100" > "$VELCRO_CI_PRIOR" 2> "$RUNNER_TEMP/required-prior.log" || : > "$VELCRO_CI_PRIOR"
          fi
          export VELCRO_CI_PRIOR
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            let good = false;
            try {
              const n = JSON.parse(process.env.VELCRO_CI_NEEDS);
              const jobs = ["security", "verify", "product", "site"];
              const named = n !== null && typeof n === "object" && !Array.isArray(n)
                && Object.keys(n).sort().join(",") === "product,security,site,verify";
              if (process.env.VELCRO_CI_CARRY === "true") {
                const { VELCRO_CI_HEAD: head, VELCRO_CI_PR: pr, VELCRO_CI_BASE: base, VELCRO_CI_RUN: run } = process.env;
                const valid = /^[0-9a-f]{40}$/.test(head) && /^[1-9][0-9]*$/.test(pr) && /^[0-9]+$/.test(run)
                  && typeof base === "string" && base !== "";
                const title = `CI pr ${pr} into ${base} (full)`;
                const latest = JSON.parse(readFileSync(process.env.VELCRO_CI_PRIOR, "utf8")).workflow_runs
                  .filter(r => Number.isSafeInteger(r.id) && String(r.id) !== run && r.path === ".github/workflows/ci.yml" && r.event === "pull_request"
                    && r.head_sha === head && r.display_title === title && Number.isSafeInteger(r.run_number))
                  .sort((a, b) => b.run_number - a.run_number)[0];
                if (valid && latest) console.log(`required: repeats run ${latest.id}`);
                good = valid && named && jobs.every(k => n[k]?.result === "skipped")
                  && latest?.status === "completed" && latest.conclusion === "success";
              } else {
                good = named && jobs.every(k => n[k]?.result === "success");
              }
            } catch {}
            console.log(good ? "required: passed" : "required: blocked");
            process.exitCode = good ? 0 : 1;
          '
