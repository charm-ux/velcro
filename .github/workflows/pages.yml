# GitHub Pages deployment for the documentation site. Runs on every push to main (so the site always reflects main) and
# through workflow_dispatch from main as a manual fallback: there is no pull-request or other trigger. Everything that can
# fail runs with read-only permissions: `checks` (history scan and source verification), `product` (product.yml: one build,
# every engine in four shards and the upstream gate, all on that one output) and `build`, which needs both, records the
# tested-bytes evidence for the output the product jobs checked, runs the site preparation check and only then uploads the
# Pages artifact. Preparation stages only the exact output that was browser-tested; the output is never rebuilt after
# verification. The `deploy` job holds the only write/OIDC permissions and runs nothing but the pinned deployment action.
# The first real deployment needs explicit owner approval (see docs/deployment.md).
name: Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.15.9
          run_install: false
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Public frozen dependency install
        run: |
          mkdir -p .airig/ci
          pnpm install --frozen-lockfile --prefer-offline --registry=https://registry.npmjs.org/ > .airig/ci/install.log 2>&1 || { echo 'install: blocked; private evidence retained'; exit 1; }
          echo 'install: passed'
      # Caches only the pinned archive the installer keeps after verifying it; the installer re-verifies a restored archive
      # against the pinned SHA-256 before extracting anything (wrong bytes fail closed) and downloads only on a miss.
      - name: Cache the pinned Gitleaks archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .airig/tools/gitleaks/8.30.1/archives
          key: gitleaks-8.30.1-linux-x64-551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      - run: node scripts/security/gitleaks.mjs install
      # Full-history mode: every commit's metadata and every file a commit changed, across all of main's ancestry,
      # under the scanner's hard caps (no 1,000-file approval cap: this is not a newly published range).
      - name: History privacy and secret scan
        run: node scripts/security/git-privacy.mjs history HEAD
      - name: Source verification with private raw output
        run: |
          pnpm verify:source > .airig/ci/verify.log 2>&1 || { echo 'verify: blocked; private evidence retained'; exit 1; }
          echo 'verify: passed'

  product:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: ./.github/workflows/product.yml
    with:
      ref: ${{ github.sha }}

  build:
    needs: [checks, product]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.15.9
          run_install: false
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Public frozen dependency install
        run: |
          mkdir -p .airig/ci
          pnpm install --frozen-lockfile --prefer-offline --registry=https://registry.npmjs.org/ > .airig/ci/install.log 2>&1 || { echo 'install: blocked; private evidence retained'; exit 1; }
          echo 'install: passed'
      - name: Download the browser-tested build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-build
          path: packages
      - name: Record the tested-bytes evidence (every product job passed on this output)
        env:
          DIGEST: ${{ needs.product.outputs.digest }}
        run: |
          pnpm verify:product --stage evidence --expect-digest "$DIGEST" > .airig/ci/evidence.log 2>&1 || { awk '/^verify:product: / && n++ < 20 { print substr($0, 1, 300) }' .airig/ci/evidence.log; echo 'evidence: blocked; private evidence retained'; exit 1; }
          echo 'evidence: passed'
      # Caches only the pinned archive the installer keeps after verifying it; the installer re-verifies a restored archive
      # against the pinned SHA-256 before extracting anything (wrong bytes fail closed) and downloads only on a miss.
      - name: Cache the pinned Gitleaks archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .airig/tools/gitleaks/8.30.1/archives
          key: gitleaks-8.30.1-linux-x64-551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      - run: node scripts/security/gitleaks.mjs install
      - name: Site preparation, notices and scans
        run: node scripts/site/prepare.mjs --base /velcro --out .airig/site/run --expect-sha "$GITHUB_SHA"
      - name: Upload the prepared site as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: .airig/site/run/site
          include-hidden-files: true

  deploy:
    needs: build
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
