<script type="module">
  import { getBasePath, registerIconLibrary } from '@charm-ux/velcro';

  registerIconLibrary('sprite', {
    resolver: name => getBasePath(`assets/images/sprite.svg#${name}`),
    mutator: svg => svg.setAttribute('fill', 'currentColor'),
    spriteSheet: true
  });
</script>

<div style="font-size: 24px;">
  <sl-icon library="sprite" name="clock"></sl-icon>
  <sl-icon library="sprite" name="speedometer"></sl-icon>
</div>
