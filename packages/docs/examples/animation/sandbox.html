<div class="animation-sandbox">
  <sl-animation name="bounce" easing="ease-in-out" duration="2000" play>
    <div class="box"></div>
  </sl-animation>

  <div class="controls">
    <label>Animation <select class="animation-name"></select></label>
    <label>Easing <select class="easing-name"></select></label>
    <label>Playback Rate <input type="number" min="0" max="2" step=".25" value="1" /></label>
  </div>
</div>

<script type="module">
  // In an application: import { getAnimationNames, getEasingNames } from '@charm-ux/velcro';
  // This preview takes them from the Velcro bundle that its document already loads.
  const { getAnimationNames, getEasingNames } = await import(document.querySelector('script[src$="/_litro/velcro.js"]').src);

  const container = document.querySelector('.animation-sandbox');
  const animation = container.querySelector('sl-animation');
  const animationName = container.querySelector('.controls .animation-name');
  const easingName = container.querySelector('.controls .easing-name');
  const playbackRate = container.querySelector('input[type="number"]');
  const animations = getAnimationNames();
  const easings = getEasingNames();

  animations.map(name => {
    const option = Object.assign(document.createElement('option'), {
      textContent: name,
      value: name
    });
    animationName.appendChild(option);
  });

  easings.map(name => {
    const option = Object.assign(document.createElement('option'), {
      textContent: name,
      value: name
    });
    easingName.appendChild(option);
  });

  animationName.value = 'bounce';
  easingName.value = 'linear';

  animationName.addEventListener('change', () => (animation.name = animationName.value));
  easingName.addEventListener('change', () => (animation.easing = easingName.value));
  playbackRate.addEventListener('input', () => (animation.playbackRate = playbackRate.value));
</script>

<style>
  .animation-sandbox .box {
    width: 100px;
    height: 100px;
    background-color: var(--sl-color-primary-600);
  }

  .animation-sandbox .controls {
    max-width: 300px;
    margin-top: 2rem;
  }

  .animation-sandbox .controls label {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    margin-bottom: 1rem;
  }
</style>
