<div class="popup-sync">
  <sl-popup id="demo-sync" placement="top" sync="width" active>
    <span slot="anchor"></span>
    <div class="box"></div>
  </sl-popup>

  <label>
    Sync
    <select>
      <option value="width" selected>Width</option>
      <option value="height">Height</option>
      <option value="both">Both</option>
      <option value="">None</option>
    </select>
  </label>
</div>

<style>
  .popup-sync span[slot='anchor'] {
    display: inline-block;
    width: 150px;
    height: 150px;
    border: dashed 2px var(--sl-color-neutral-600);
    margin: 50px;
  }

  .popup-sync .box {
    width: 100%;
    height: 100%;
    min-width: 50px;
    min-height: 50px;
    background: var(--sl-color-primary-600);
    border-radius: var(--sl-border-radius-medium);
  }
</style>

<script>
  const container = document.querySelector('.popup-sync');
  const popup = container.querySelector('sl-popup');
  const sync = container.querySelector('select');

  sync.addEventListener('change', () => (popup.sync = sync.value));
</script>
