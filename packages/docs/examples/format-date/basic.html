<div style="display: flex; flex-direction: column; gap: 1rem">

  </div>
  <div id="demo-now">
    Current date and time, with options:

    <sl-format-date date="2020-07-15T15:17:00Z" time-zone="UTC" hour="numeric" minute="numeric" hour-format="24"></sl-format-date>
